name: Publier le flux RSS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v5

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publier le flux RSS
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
